<!doctype html>
<html><head><meta charset="utf-8"><title>WebMCP fixture</title></head>
<body>
  <h1>WebMCP fixture</h1>
  <a id="ext" href="https://example.com/outside">outside link</a>
  <script>
    (async () => {
      const mc = document.modelContext;
      if (!mc) { document.title = 'no modelContext'; return; }
      await mc.registerTool({
        name: 'demo-echo',
        description: 'Echoes its input back',
        inputSchema: { type: 'object', properties: { s: { type: 'string' } }, required: ['s'] },
        execute: ({ s }) => ({ echoed: s, title: document.title }),
      });
      document.title = 'fixture ready';
    })();
  </script>
</body></html>
