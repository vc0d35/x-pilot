name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Build and publish without a signing certificate (test builds only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # contents: write publishes the draft release; the other two let the job mint a provenance
    # attestation for the artifacts it just built.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      # No dependency install script runs in the job that later holds the signing secrets. The
      # only one this build needs is Electron's binary download, which is invoked explicitly.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      # An unsigned bundle seals nothing: its app.asar can be rewritten in place and Gatekeeper
      # teaches users to right-click-Open. A tag push therefore requires a certificate; going
      # without one has to be asked for by hand, and it never reaches a release page.
      - name: Choose signing mode
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK secret present: signing and publishing."
            echo "PUBLISH_MODE=always" >> "$GITHUB_ENV"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::No signing certificate: building unsigned artifacts and NOT publishing them."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "PUBLISH_MODE=never" >> "$GITHUB_ENV"
          else
            echo "::error::No CSC_LINK secret configured; refusing to build an unsigned release. Re-run from the Actions tab with allow_unsigned to produce unpublished test artifacts."
            exit 1
          fi
      - name: Build and publish
        run: npm run build && node scripts/render-entitlements.mjs && npx electron-builder --mac --publish "$PUBLISH_MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Only set XPILOT_TEAM_ID once build/embedded.provisionprofile ships with the
          # repo: the passkey entitlement without a profile is SIGKILLed at launch.
          XPILOT_TEAM_ID: ${{ secrets.XPILOT_TEAM_ID }}
      - name: Verify the published bundle is really signed
        if: env.PUBLISH_MODE == 'always'
        run: |
          APP="dist/mac-arm64/XPilot.app"
          codesign --verify --deep --strict "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -q 'flags=.*runtime'
          # @electron/fuses colours its output even when it is piped, so the codes come off first.
          FUSES=$(npx @electron/fuses read --app "$APP" | sed $'s/\x1b\\[[0-9;]*m//g')
          echo "$FUSES"
          grep -q 'EnableCookieEncryption is Enabled' <<< "$FUSES"
          grep -q 'GrantFileProtocolExtraPrivileges is Disabled' <<< "$FUSES"
      # Binds each artifact's digest to this workflow run, so a download can be checked against the
      # commit and workflow it claims to come from: gh attestation verify <file> --repo vc0d35/x-pilot
      - name: Attest the build provenance
        if: env.PUBLISH_MODE == 'always'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
